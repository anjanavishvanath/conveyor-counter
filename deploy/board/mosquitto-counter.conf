# deploy/board/mosquitto-counter.conf -> /etc/mosquitto/conf.d/counter.conf
# Local message bus between the vision service, the API and the UI, on the board only.
# Ubuntu's /etc/mosquitto/mosquitto.conf already sets persistence (/var/lib/mosquitto/), which
# keeps the retained 'state' message across a broker restart. Do not repeat those lines here.
listener 1883 127.0.0.1
allow_anonymous true
