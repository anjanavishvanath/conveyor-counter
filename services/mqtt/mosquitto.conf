# services/mqtt/mosquitto.conf
# Local message bus between the vision service, the API and the UI.
# It is a convenience bus, not a control path: counting and the conveyor interlock keep
# working with the broker down (see safety.fault_on_bus_loss in config/site.yaml).

listener 1883 0.0.0.0
allow_anonymous true

# Keep retained messages (the 'state' topic) across a broker restart so a UI that opens
# after a restart still sees the current state instead of a blank screen.
persistence true
persistence_location /mosquitto/data/
autosave_interval 30

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true

# On the board, bind to localhost only:
#   listener 1883 127.0.0.1
# If the UI runs on another machine on the plant LAN, keep 0.0.0.0 but add
# a password file and firewall the port.
